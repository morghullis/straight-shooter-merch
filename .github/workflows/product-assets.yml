# Makes the storefront assets (3D model, front and back renders, on-model hover photo) of Shopify
# products: see tools/pipeline/README.md. A product runs when it is new, when the merchant adds a photo,
# or when it is tagged "regenerate-assets". Takes a quick look at the store (that installs nothing)
# every 5 minutes, GitHub's shortest schedule (it can run a little late when GitHub is busy); right
# away when the storefront's Shopify webhook asks for it; and by hand from the Actions tab.
#
# Needs these repository secrets: SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET, MESHY_API_KEY,
# and the repository variable SHOPIFY_STORE_DOMAIN (e.g. my-store.myshopify.com).
name: Product assets

on:
  repository_dispatch:
    types: [shopify-product-changed, shopify-product-created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      products:
        description: Product handles to (re)do, separated by spaces. Empty = every product that needs it.
        required: false
        default: ""
      max:
        description: Most products in this run
        required: false
        default: "3"
      smoke:
        description: Free test of the machinery (no Meshy, nothing written to Shopify) with the named products' current 3D models
        type: boolean
        required: false
        default: false

# One run at a time, so a product is never generated twice.
concurrency:
  group: product-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
      # Only a run started by hand names products (they are redone even if up to date); a webhook's
      # run checks the whole store, so an edit never forces a regeneration. Passed through the
      # environment, never pasted into the script (generate.mjs validates them).
      PRODUCTS: ${{ inputs.products || '' }}
      MAX: ${{ inputs.max || '3' }}
      SMOKE: ${{ inputs.smoke && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/3d/package-lock.json

      # Plain Node, nothing installed: is there anything to make? Sets `pending`.
      # Word splitting on, globbing off: PRODUCTS is a list of handles, never file patterns.
      # Secrets go only to the steps that use them, never to the installs (dependency scripts run there).
      - name: Check
        id: check
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          set -f
          node tools/pipeline/generate.mjs $PRODUCTS --check

      # three.js comes from the storefront's dependencies; the 3D tools have their own.
      - if: steps.check.outputs.pending != '0'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.pending != '0'
        run: npm ci --prefix tools/3d

      - name: Generate
        if: steps.check.outputs.pending != '0'
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -f
          if [ -n "$SMOKE" ]; then
            node tools/pipeline/generate.mjs $PRODUCTS --smoke --local "$RUNNER_TEMP/smoke"
          else
            node tools/pipeline/generate.mjs $PRODUCTS --max "$MAX"
          fi

      - name: Smoke test output
        if: env.SMOKE != '' && steps.check.outputs.pending != '0'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: ${{ runner.temp }}/smoke
          retention-days: 3
